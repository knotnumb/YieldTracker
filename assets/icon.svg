<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed dark background so the icon is maskable-safe -->
  <rect width="512" height="512" fill="#060908"/>
  <rect x="56" y="56" width="400" height="400" fill="none" stroke="#009E52" stroke-width="4" opacity="0.5"/>
  <!-- rising yield line (content kept within the maskable safe zone ~center 80%) -->
  <polyline points="104,392 184,320 256,352 336,216 416,144"
    fill="none" stroke="#00EF78" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#00EF78">
    <circle cx="104" cy="392" r="14"/>
    <circle cx="184" cy="320" r="14"/>
    <circle cx="256" cy="352" r="14"/>
    <circle cx="336" cy="216" r="14"/>
    <circle cx="416" cy="144" r="18"/>
  </g>
  <!-- baseline -->
  <line x1="104" y1="392" x2="104" y2="416" stroke="#009E52" stroke-width="4"/>
</svg>
