<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YieldTracker — Best Stablecoin Yields</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060908">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon.svg">
<style>
  :root {
    --bg:          #060908;
    --bg-deep:     #030504;
    --panel:       #0A0E0A;
    --panel-hi:    #0E1310;
    --border:      #192C1D;
    --border-hi:   #27402C;
    --text:        #CCDACE;
    --muted:       #4D6A54;
    --muted-mid:   #6B8870;
    --accent:      #00EF78;
    --accent-dim:  #009E52;
    --accent-glow: rgba(0,239,120,0.07);
    --accent-lo:   rgba(0,239,120,0.13);
    --warn:        #F5A024;
    --warn-dim:    rgba(245,160,36,0.09);
    --err:         #E54E4E;
    --err-dim:     rgba(229,78,78,0.09);
    --info:        #4DBAF5;
    --info-dim:    rgba(77,186,245,0.09);
    --font:        ui-monospace,'Cascadia Mono','Cascadia Code',Menlo,Consolas,'Courier New',monospace;
  }

  html::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom, transparent 0, transparent 2px,
      rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 3px
    );
    pointer-events: none;
    z-index: 9999;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.55;
  }

  /* ── APP BAR ── */
  .app-bar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    padding: 22px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .app-name { font-size: 18px; font-weight: 700; letter-spacing: 0.15em; color: var(--accent); text-transform: uppercase; line-height: 1; }
  .app-meta { font-size: 10px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 6px; }
  .app-meta b { color: var(--muted-mid); font-weight: 600; }

  /* ── PANELS ── */
  .panel {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 14px 16px;
    margin-bottom: 11px;
  }
  .panel::before {
    content: '';
    position: absolute;
    top: -1px; left: -1px;
    width: 16px; height: 16px;
    border-top: 2px solid var(--accent-dim);
    border-left: 2px solid var(--accent-dim);
    pointer-events: none;
  }

  /* ── BUTTONS ── */
  button {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    padding: 6px 14px;
    font-family: var(--font);
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; border-radius: 0;
    transition: background 0.1s, border-color 0.1s, color 0.1s;
  }
  button:hover { background: var(--accent-lo); border-color: var(--accent); }
  button.sec { color: var(--muted-mid); border-color: var(--border-hi); }
  button.sec:hover { color: var(--text); border-color: var(--muted-mid); background: transparent; }
  button.active { background: var(--accent-lo); color: var(--accent); border-color: var(--accent); }

  a.linkbtn {
    display: inline-block; text-decoration: none;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent-dim);
    padding: 6px 14px; font-size: 10px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    transition: background 0.1s, border-color 0.1s;
  }
  a.linkbtn:hover { background: var(--accent-lo); border-color: var(--accent); }

  /* ── STATUS ── */
  .status { font-size: 11px; padding: 8px 12px; margin-top: 10px; border-left: 3px solid; letter-spacing: 0.02em; }
  .status.ok   { background: var(--accent-glow); color: var(--accent); border-color: var(--accent-dim); }
  .status.err  { background: var(--err-dim);     color: var(--err);    border-color: var(--err); }
  .status.info { background: var(--info-dim);    color: var(--info);   border-color: var(--info); }

  /* ── CONTROL BARS ── */
  .bar { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 8px; }
  .bar:last-child { margin-bottom: 0; }
  .bar button { padding: 5px 11px; }
  .row-label { color: var(--muted); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-right: 2px; }
  .divider { width: 1px; height: 22px; background: var(--border-hi); margin: 0 4px; }

  input[type=text], input[type=number] {
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border-hi);
    color: var(--text);
    font-family: var(--font);
    font-size: 11px;
    padding: 6px 9px;
    border-radius: 0; outline: none;
    transition: border-left-color 0.15s;
  }
  input[type=text]:focus, input[type=number]:focus { border-left-color: var(--accent-dim); }
  input[type=text]::placeholder, input[type=number]::placeholder { color: var(--muted); }
  input#search { width: 100%; max-width: 100%; }
  input#minTvl { width: 70px; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type=number] { -moz-appearance: textfield; }

  /* ── LIST ── */
  .list-head {
    display: grid; grid-template-columns: 1fr 90px 90px;
    gap: 8px; padding: 6px 12px;
    font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--border-hi);
  }
  .list-head .r { text-align: right; }
  .list { border: 1px solid var(--border); background: var(--bg-deep); }

  .group-head {
    padding: 6px 12px; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted-mid); background: var(--panel-hi);
    border-bottom: 1px solid var(--border); border-top: 1px solid var(--border);
  }
  .group-head:first-child { border-top: none; }

  .item { border-bottom: 1px solid var(--border); }
  .item:last-child { border-bottom: none; }
  .item.ys { border-left: 2px solid var(--accent-dim); }
  .item-main {
    display: grid; grid-template-columns: 1fr 90px 90px;
    gap: 8px; padding: 9px 12px; cursor: pointer; align-items: center;
    transition: background 0.1s;
  }
  .item-main:hover { background: var(--accent-glow); }
  .item.open .item-main { background: var(--accent-lo); }
  .nm { min-width: 0; }
  .nm .vname { color: var(--text); font-weight: 500; font-size: 12px; }
  .nm .vmeta { color: var(--muted); font-size: 10px; margin-top: 1px; }
  .vapy { text-align: right; color: var(--accent); font-size: 13px; font-variant-numeric: tabular-nums; }
  .vrwd { font-size: 9px; color: var(--muted); }
  .vtvl { text-align: right; color: var(--muted-mid); font-size: 11px; font-variant-numeric: tabular-nums; }

  .protocol-link {
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; margin-left: 6px;
    font-size: 10px; font-weight: 700; line-height: 1;
    color: var(--accent); border: 1px solid var(--accent-dim);
    text-decoration: none; vertical-align: middle;
    transition: background 0.1s, border-color 0.1s;
  }
  .protocol-link:hover { background: var(--accent-lo); border-color: var(--accent); }
  .ys-badge, .blocked-badge {
    display: inline-block; font-size: 8px; padding: 1px 5px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; margin-left: 6px; vertical-align: middle;
  }
  .ys-badge { background: var(--accent-lo); color: var(--accent); border: 1px solid var(--accent-dim); }
  .blocked-badge { background: var(--err-dim); color: var(--err); border: 1px solid var(--err); }

  /* ── EXPANDED DETAIL ── */
  .detail { display: none; padding: 4px 12px 14px; background: var(--bg-deep); border-top: 1px dashed var(--border-hi); }
  .item.open .detail { display: block; }
  .detail-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px; margin-top: 10px;
  }
  .dcell { background: var(--panel); border: 1px solid var(--border); border-bottom: 2px solid var(--border-hi); padding: 8px 10px; }
  .dcell .dl { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 3px; }
  .dcell .dv { color: var(--text); font-size: 14px; font-variant-numeric: tabular-nums; }

  /* ── COMPACT DENSITY ── */
  body.compact .item-main { padding: 5px 12px; }
  body.compact .nm .vmeta { display: none; }
  body.compact .nm .vname { font-size: 11px; }

  .empty { padding: 24px 12px; text-align: center; color: var(--muted); font-size: 11px; }
  .foot { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .foot .note { color: var(--muted); font-size: 10px; letter-spacing: 0.06em; }

  @media (max-width: 560px) {
    .list-head, .item-main { grid-template-columns: 1fr 72px 72px; gap: 6px; }
    .app-name { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="app-bar">
  <div>
    <div class="app-name">YieldTracker</div>
    <div class="app-meta" id="asOf">Best stablecoin yields · loading…</div>
  </div>
  <div>
    <a class="linkbtn" href="chart.html">Graphs →</a>
  </div>
</div>

<div class="panel">
  <div class="bar">
    <span class="row-label">View:</span>
    <button data-preset="apy"     class="active" onclick="setPreset('apy')">Best APY</button>
    <button data-preset="chain"   class="sec"    onclick="setPreset('chain')">By Chain</button>
    <button data-preset="protocol" class="sec"   onclick="setPreset('protocol')">By Protocol</button>
    <button data-preset="tvl"     class="sec"    onclick="setPreset('tvl')">Blue-chip</button>
    <button data-preset="ys"      class="sec"    onclick="setPreset('ys')"><img src="assets/ys-logo.png" height="12" alt="" style="vertical-align:middle;margin-right:4px">YieldSeeker</button>
  </div>

  <div class="bar">
    <span class="row-label">Chain:</span>
    <button data-chain="all"      class="active" onclick="setChain('all')">All</button>
    <button data-chain="base"     class="sec"    onclick="setChain('base')">Base</button>
    <button data-chain="arbitrum" class="sec"    onclick="setChain('arbitrum')">Arbitrum</button>
    <button data-chain="optimism" class="sec"    onclick="setChain('optimism')">Optimism</button>
    <button data-chain="polygon"  class="sec"    onclick="setChain('polygon')">Polygon</button>
    <button data-chain="unichain" class="sec"    onclick="setChain('unichain')">Unichain</button>
    <div class="divider"></div>
    <span class="row-label">Min TVL $</span>
    <input type="number" id="minTvl" placeholder="0" min="0" step="0.1" oninput="onControl()">
    <span class="row-label">m</span>
    <div class="divider"></div>
    <button id="btn-density" class="sec" onclick="toggleDensity()">Compact</button>
  </div>

  <div class="bar" style="margin-top:2px;">
    <input type="text" id="search" placeholder="Search pool, project, chain…" oninput="onControl()">
  </div>
</div>

<div id="loadStatus"></div>

<div class="panel" id="listPanel" style="display:none">
  <div class="list-head">
    <div>Vault</div><div class="r">APY</div><div class="r">TVL</div>
  </div>
  <div class="list" id="list"></div>
</div>

<div class="foot">
  <span class="note" id="countNote"></span>
  <a class="linkbtn" href="chart.html">Open Graphs →</a>
</div>

<script>
// ============================================================================
//  YS Whitelist — MUST stay in sync with chart.html and tracker.html YS_VAULTS.
//  (Copied verbatim from chart.html v2026-07-18a. If you edit one, edit all.)
// ============================================================================
const YS_VAULTS = [
  { name: '40 Acres USDC Vault',              pool: /40 acres/i,                   project: /harvest/i,    blocked: true  },
  { name: 'Steakhouse High Yield USDC v1.1',  pool: /bbqusdc/i,                    project: /morpho/i                     },
  { name: 'Steakhouse Prime USDC',            pool: /^steakusdc$/i,                project: /morpho/i                     },
  { name: 'Aave Base USDC',                   pool: /usdc/i,                       project: /aave v3/i,    chain: /base/i },
  { name: 'Spark USDC Vault',                 pool: /sparkusdc/i,                  project: /morpho/i                     },
  { name: 'Gauntlet USDC Frontier',           pool: /gtusdcf/i,                    project: /morpho/i                     },
  { name: 'Revert Lend Base USDC',            pool: /usdc/i,                       project: /revert/i                     },
  { name: 'Tokemak baseUSD',                  pool: /baseusd/i,                    project: /tokemak/i                    },
  { name: 'Otto Earns ottoUSD',               pool: /ottousd/i,                    project: /tokemak/i                    },
  { name: 'AlphaGrowth USDC',                 pool: /usdc/i,                       project: /alphagrowth/i                },
  { name: 'yoVaultUSD',                       pool: /yoUSD|yovault/i,              chain: /base/i                         },
  { name: 'yoVaultUSD',                       project: /yo protocol/i,             chain: /base/i                         },
  { name: 'Yearn OG USDC',                    pool: /ymvog.?usdc|re7usdc/i,        project: /morpho/i                     },
  { name: 'UltraYield USDC',                  pool: /ultra.*usdc|ultrayield|edgeusdc/i, project: /morpho/i               },
  { name: 'Moonwell USDC',                    pool: /^usdc$/i,                     project: /moonwell lending/i, chain: /base/i },
  { name: 'Moonwell Ecosystem USDC Vault',    pool: /^mwusdc$|^meusdc$/i,          project: /morpho/i,     chain: /base/i },
  { name: 'Clearstar USDC Reactor',           pool: /^csusdc$/i,                   project: /morpho/i                     },
  { name: 'Clearstar Boring USDC',            pool: /^csborusdc$/i,                project: /morpho/i                     },
  { name: 'Yield Clearstar USDC',             pool: /^ycsusdc$/i,                  project: /morpho/i                     },
  { name: 'Gauntlet USDC Core',               pool: /^gtusdcc$/i,                  project: /morpho/i,     chain: /base/i },
  { name: 'Gauntlet USDC Prime',              pool: /^gtusdcp$/i,                  project: /morpho/i,     chain: /base/i },
  { name: 'Fluid USD Coin',                   pool: /^usdc$/i,                     project: /fluid/i,      chain: /base/i },
  { name: 'Avantis USDC Vault',               project: /avantis/i,                 chain: /base/i,         blocked: true  },
  { name: 'Clearstar cbAssets Vault',         pool: /^clearstar cbassets vault$/i,        project: /morpho/i,     chain: /base/i },
  { name: 'Gauntlet USDC Frontier (V2)',      pool: /^gauntlet usdc frontier \(v2\)$/i,   project: /morpho/i,     chain: /base/i },
  { name: 'Moonwell Ecosystem USDC (V2)',     pool: /^moonwell ecosystem usdc \(v2\)$/i,  project: /morpho/i,     chain: /base/i },
  { name: 'Yearn OG USDC V2',                 pool: /^yearn og usdc v2$/i,                project: /morpho/i,     chain: /base/i },
  { name: 'Steakhouse High Yield USDC (V2)',  pool: /^steakhouse high yield usdc \(v2\)$/i, project: /morpho/i,   chain: /base/i },
  { name: 'ARCHITECT Global Value II',        pool: /^architect global value ii$/i,       project: /morpho/i,     chain: /base/i },
  { name: 'Farcaster x Steakhouse Prime',     pool: /^farcaster x steakhouse prime$/i,    project: /morpho/i,     chain: /base/i },
  { name: 'Gauntlet USDC Prime (V2)',         pool: /^gauntlet usdc prime \(v2\)$/i,      project: /morpho/i,     chain: /base/i },
  { name: 'RockawayX Midas USDC Prime',       pool: /^rockawayx midas usdc prime$/i,      project: /morpho/i,     chain: /base/i },
  { name: 'Steakhouse Prime USDC (V2)',       pool: /^steakhouse prime usdc \(v2\)$/i,    project: /morpho/i,     chain: /base/i },
  { name: 'Prime USDC',                       pool: /^prime usdc$/i,                      project: /morpho/i,     chain: /base/i },
  { name: 'Clearstar Boring USDC (V2)',       pool: /^clearstar boring usdc \(v2\)$/i,    project: /morpho/i,     chain: /base/i },
  { name: 'Moonwell Flagship USDC',           pool: /^moonwell flagship usdc$/i,          project: /morpho/i,     chain: /base/i },
  { name: 'Alpha USDC Prime V2',              pool: /^alpha usdc prime v2$/i,             project: /morpho/i,     chain: /base/i },
  { name: 'Steakhouse High Yield USDC Edition', pool: /^steakhouse high yield usdc edition$/i, project: /morpho/i, chain: /base/i },
  { name: 'Universal USDC',                   pool: /^universal usdc$/i,                  project: /morpho/i,     chain: /base/i },
  { name: 'Re7 USDC',                         pool: /^re7 usdc$/i,                        project: /morpho/i,     chain: /base/i },
  { name: 'Clearstar CoreUSDC',               pool: /^clearstar coreusdc$/i,              project: /morpho/i,     chain: /base/i },
  { name: 'Riva x Steakhouse USDC',           pool: /^riva x steakhouse usdc$/i,          project: /morpho/i,     chain: /base/i },
  { name: 'Ethena x Steakhouse USDC',         pool: /^ethena x steakhouse usdc$/i,        project: /morpho/i,     chain: /base/i },
  { name: 'Avantgarde USDC Conservative',     pool: /^avantgarde usdc conservative$/i,    project: /morpho/i,     chain: /base/i },
  { name: 'Compound USDC',                    pool: /^usdc$/i,                            project: /compound/i,   chain: /base/i },
  { name: 'Spark USDC Vault (SparkFi)',       pool: /^usdc$/i,                            project: /sparkfi/i,    chain: /base/i },
];

function isYS(v) {
  const m = YS_VAULTS.find(r => {
    if (r.pool    && !r.pool.test(v.pool))       return false;
    if (r.project && !r.project.test(v.project)) return false;
    if (r.chain   && !r.chain.test(v.chain))     return false;
    return true;
  });
  return m ? { ys: true, blocked: !!m.blocked, name: m.name ?? null } : { ys: false, blocked: false, name: null };
}

// DefiLlama protocol-slug overrides (kept in sync with chart.html).
const PROTOCOL_SLUG_ALIASES = {
  'tokemak': 'autofinance',
  'morpho': 'morpho-blue',
  'morpho v1': 'morpho-blue',
  'yo': 'yo-protocol',
};
function protocolSlug(project) {
  const key = String(project ?? '').toLowerCase().trim();
  if (PROTOCOL_SLUG_ALIASES[key]) return PROTOCOL_SLUG_ALIASES[key];
  return key.replace(/[^a-z0-9\s.-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-');
}

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function parseNum(s) {
  if (s === null || s === undefined || s === '') return null;
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function fmtUsd(v) {
  if (v === null || v === undefined) return '—';
  if (v >= 1e9) return '$' + (v/1e9).toFixed(2) + 'b';
  if (v >= 1e6) return '$' + (v/1e6).toFixed(2) + 'm';
  if (v >= 1e3) return '$' + (v/1e3).toFixed(1) + 'k';
  return '$' + v.toFixed(0);
}
function fmtPct(v) { return v === null ? '—' : v.toFixed(2) + '%'; }
function showStatus(msg, type) {
  document.getElementById('loadStatus').innerHTML = msg ? `<div class="status ${type}">${escHtml(msg)}</div>` : '';
}

// ============ State + prefs ============
const PREFS_KEY = 'yt-viewer-prefs';
let rows = [];        // latest-date rows, enriched
let latestDate = '';
let prefs = { preset: 'apy', chain: 'all', minTvl: '', search: '', density: 'normal' };

function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
    prefs = { ...prefs, ...p };
  } catch (e) { /* ignore corrupt prefs */ }
}
function savePrefs() {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) { /* storage may be blocked */ }
}

// ============ Controls ============
function setPreset(p) {
  prefs.preset = p; savePrefs();
  document.querySelectorAll('[data-preset]').forEach(b => b.className = b.dataset.preset === p ? 'active' : 'sec');
  render();
}
function setChain(c) {
  prefs.chain = c; savePrefs();
  document.querySelectorAll('[data-chain]').forEach(b => b.className = b.dataset.chain === c ? 'active' : 'sec');
  render();
}
function onControl() {
  prefs.minTvl = document.getElementById('minTvl').value;
  prefs.search = document.getElementById('search').value;
  savePrefs();
  render();
}
function toggleDensity() {
  prefs.density = prefs.density === 'compact' ? 'normal' : 'compact';
  savePrefs();
  applyDensity();
}
function applyDensity() {
  const on = prefs.density === 'compact';
  document.body.classList.toggle('compact', on);
  document.getElementById('btn-density').className = on ? 'active' : 'sec';
}

function syncControlsToPrefs() {
  document.querySelectorAll('[data-preset]').forEach(b => b.className = b.dataset.preset === prefs.preset ? 'active' : 'sec');
  document.querySelectorAll('[data-chain]').forEach(b => b.className = b.dataset.chain === prefs.chain ? 'active' : 'sec');
  document.getElementById('minTvl').value = prefs.minTvl || '';
  document.getElementById('search').value = prefs.search || '';
  applyDensity();
}

// ============ Filter + sort ============
function getVisible() {
  const q = (prefs.search || '').toLowerCase();
  const minTvl = (prefs.minTvl && parseFloat(prefs.minTvl) > 0) ? parseFloat(prefs.minTvl) * 1e6 : null;
  let out = rows.filter(v => {
    if (prefs.preset === 'ys' && !v.ys) return false;
    if (prefs.chain !== 'all' && !new RegExp(prefs.chain, 'i').test(v.chain)) return false;
    if (minTvl !== null && (v.tvl === null || v.tvl < minTvl)) return false;
    if (q && !v.pool.toLowerCase().includes(q) && !v.project.toLowerCase().includes(q)
          && !v.chain.toLowerCase().includes(q) && !(v.name || '').toLowerCase().includes(q)) return false;
    return true;
  });
  const byApy = (a, b) => (b.apy ?? -1) - (a.apy ?? -1);
  if (prefs.preset === 'tvl')      out.sort((a, b) => (b.tvl ?? -1) - (a.tvl ?? -1));
  else if (prefs.preset === 'chain')    out.sort((a, b) => a.chain.localeCompare(b.chain) || byApy(a, b));
  else if (prefs.preset === 'protocol') out.sort((a, b) => a.project.localeCompare(b.project) || byApy(a, b));
  else out.sort(byApy);
  return out;
}

// ============ Render ============
function render() {
  const vis = getVisible();
  const panel = document.getElementById('listPanel');
  const list = document.getElementById('list');
  panel.style.display = 'block';

  if (!vis.length) {
    list.innerHTML = `<div class="empty">No vaults match the current filters.</div>`;
    document.getElementById('countNote').textContent = `0 of ${rows.length} vaults`;
    return;
  }

  const grouped = (prefs.preset === 'chain' || prefs.preset === 'protocol');
  const groupKey = prefs.preset === 'chain' ? (v => v.chain) : (v => v.project);
  let html = '', lastGroup = null;

  vis.forEach((v, i) => {
    if (grouped) {
      const g = groupKey(v);
      if (g !== lastGroup) { html += `<div class="group-head">${escHtml(g || '—')}</div>`; lastGroup = g; }
    }
    const badge = v.ys
      ? (v.blocked ? `<span class="blocked-badge">⊘ Blocked</span>` : `<span class="ys-badge"><img src="assets/ys-logo.png" height="10" alt="" style="vertical-align:middle;margin-right:3px">YS</span>`)
      : '';
    const url = `https://defillama.com/protocol/${protocolSlug(v.project)}`;
    const rwd = (v.reward_apy !== null && v.reward_apy > 0) ? `<div class="vrwd">+${v.reward_apy.toFixed(2)}% rwd</div>` : '';
    html += `<div class="item ${v.ys ? 'ys' : ''}" id="it-${i}">
      <div class="item-main" onclick="toggleItem(${i})">
        <div class="nm">
          <span class="vname">${escHtml(v.name || v.pool)}</span>${badge}<a href="${url}" target="_blank" rel="noopener noreferrer" class="protocol-link" onclick="event.stopPropagation()" title="Open ${escHtml(v.project)} on DefiLlama">↗</a>
          <div class="vmeta">${escHtml(v.project)} · ${escHtml(v.chain || '—')}</div>
        </div>
        <div class="vapy">${fmtPct(v.apy)}${rwd}</div>
        <div class="vtvl">${fmtUsd(v.tvl)}</div>
      </div>
      <div class="detail">${detailHtml(v)}</div>
    </div>`;
  });
  list.innerHTML = html;

  const ys = vis.filter(v => v.ys).length;
  document.getElementById('countNote').textContent =
    `${vis.length} of ${rows.length} vaults${ys ? ` · ${ys} YieldSeeker` : ''}`;
}

function detailHtml(v) {
  const cells = [
    ['Rank',           v.rank ?? '—'],
    ['Base APY',       fmtPct(v.base_apy)],
    ['Reward APY',     fmtPct(v.reward_apy)],
    ['Base 7d',        fmtPct(v.base_apy_7d)],
    ['30d Avg',        fmtPct(v.avg_30d)],
    ['Inception APY',  fmtPct(v.inception_apy)],
    ['IL 7d',          fmtPct(v.il_7d)],
    ['TVL',            fmtUsd(v.tvl)],
    ['Total Pool',     fmtUsd(v.total_pool)],
    ['Total Borrowed', fmtUsd(v.total_borrowed)],
    ['Avail. Liquidity', fmtUsd(v.avail_liquidity)],
    ['Cap Util',       v.supply_cap_util !== null ? v.supply_cap_util.toFixed(1) + '%' : '—'],
    ['Top 10%',        v.top_10_pct !== null ? v.top_10_pct.toFixed(1) + '%' : '—'],
  ];
  return `<div class="detail-grid">` + cells.map(([l, val]) =>
    `<div class="dcell"><div class="dl">${l}</div><div class="dv">${val}</div></div>`).join('') + `</div>`;
}

function toggleItem(i) {
  document.getElementById('it-' + i).classList.toggle('open');
}

// ============ CSV parse ============
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const header = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
  const all = [];
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const cells = [];
    let cur = '', inQ = false;
    for (let j = 0; j < line.length; j++) {
      if (line[j] === '"') { inQ = !inQ; continue; }
      if (line[j] === ',' && !inQ) { cells.push(cur); cur = ''; }
      else cur += line[j];
    }
    cells.push(cur);
    const row = {};
    header.forEach((h, idx) => row[h] = cells[idx] ?? '');
    all.push(row);
  }
  return all;
}

function buildLatest(all) {
  const dates = [...new Set(all.map(r => r.date).filter(Boolean))].sort();
  latestDate = dates[dates.length - 1] || '';
  const dayRows = all.filter(r => r.date === latestDate && r.chain && r.chain.trim());
  // Key by daily `rank` (unique per day), NOT pool|project|chain — 17 distinct vaults
  // share the same pool/project/chain triple (no address column in the schema), so a
  // triple key would silently drop them. rank also collapses an accidental double-append
  // (last-wins keeps the freshest block).
  const map = {};
  for (const r of dayRows) map[r.rank] = r;
  rows = Object.values(map).map(r => {
    const ys = isYS({ pool: r.pool, project: r.project, chain: r.chain });
    return {
      pool: r.pool, project: r.project, chain: r.chain,
      name: ys.name, ys: ys.ys, blocked: ys.blocked,
      rank: r.rank,
      apy:            parseNum(r.apy),
      base_apy:       parseNum(r.base_apy),
      reward_apy:     parseNum(r.reward_apy),
      base_apy_7d:    parseNum(r.base_apy_7d),
      il_7d:          parseNum(r.il_7d),
      avg_30d:        parseNum(r.avg_30d),
      inception_apy:  parseNum(r.inception_apy),
      top_10_pct:     parseNum(r.top_10_pct),
      tvl:            parseNum(r.tvl_raw),
      total_pool:     parseNum(r.total_pool),
      total_borrowed: parseNum(r.total_borrowed),
      avail_liquidity: parseNum(r.avail_liquidity),
      supply_cap_util: parseNum(r.supply_cap_util),
    };
  });
}

function ingest(text) {
  const all = parseCSV(text);
  if (!all.length) { showStatus('master.csv is empty.', 'err'); return; }
  buildLatest(all);
  showStatus('', '');
  const d = latestDate || 'unknown';
  document.getElementById('asOf').innerHTML =
    `Best stablecoin yields · as of <b>${escHtml(d)} (UTC)</b> · ${rows.length} vaults`;
  syncControlsToPrefs();
  render();
}

// ============ Load ============
async function pickFileFallback() {
  try {
    const [fh] = await window.showOpenFilePicker({ types: [{ description: 'CSV', accept: { 'text/csv': ['.csv'] } }] });
    ingest(await (await fh.getFile()).text());
  } catch (e) {
    if (e.name !== 'AbortError') showStatus('Error: ' + e.message, 'err');
  }
}

async function init() {
  loadPrefs();
  syncControlsToPrefs();
  showStatus('Loading master.csv…', 'info');
  try {
    const res = await fetch('master.csv?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    ingest(await res.text());
  } catch (e) {
    // Likely opened from file:// (fetch blocked) or offline with no cache — offer the picker.
    showStatus('Could not fetch master.csv (' + e.message + '). If you opened this file directly, ' +
      'click below to pick master.csv manually.', 'err');
    const btn = document.createElement('button');
    btn.textContent = 'Open master.csv';
    btn.onclick = pickFileFallback;
    btn.style.marginTop = '10px';
    document.getElementById('loadStatus').appendChild(btn);
  }
}

init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
