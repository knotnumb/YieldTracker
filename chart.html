<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DeFi Yield Chart</title>
<style>
  :root {
    --bg:          #060908;
    --bg-deep:     #030504;
    --panel:       #0A0E0A;
    --panel-hi:    #0E1310;
    --border:      #192C1D;
    --border-hi:   #27402C;
    --text:        #CCDACE;
    --muted:       #4D6A54;
    --muted-mid:   #6B8870;
    --accent:      #00EF78;
    --accent-dim:  #009E52;
    --accent-glow: rgba(0,239,120,0.07);
    --accent-lo:   rgba(0,239,120,0.13);
    --warn:        #F5A024;
    --warn-dim:    rgba(245,160,36,0.09);
    --err:         #E54E4E;
    --err-dim:     rgba(229,78,78,0.09);
    --info:        #4DBAF5;
    --info-dim:    rgba(77,186,245,0.09);
    --font:        ui-monospace,'Cascadia Mono','Cascadia Code',Menlo,Consolas,'Courier New',monospace;
  }

  html::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom, transparent 0, transparent 2px,
      rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 3px
    );
    pointer-events: none;
    z-index: 9999;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    max-width: 1700px;
    margin: 0 auto;
    padding: 0 32px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.55;
  }

  /* ── APP BAR ── */
  .app-bar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 22px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .app-name { font-size: 18px; font-weight: 700; letter-spacing: 0.15em; color: var(--accent); text-transform: uppercase; line-height: 1; }
  .app-meta { font-size: 10px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 6px; }

  /* ── PANELS ── */
  .panel {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 18px 22px;
    margin-bottom: 11px;
    border-radius: 0;
  }
  .panel::before {
    content: '';
    position: absolute;
    top: -1px; left: -1px;
    width: 16px; height: 16px;
    border-top: 2px solid var(--accent-dim);
    border-left: 2px solid var(--accent-dim);
    pointer-events: none;
  }
  .panel h2 {
    font-size: 10px; font-weight: 600; color: var(--muted-mid);
    text-transform: uppercase; letter-spacing: 0.2em;
    margin: 0 0 14px 0; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  /* ── BUTTONS ── */
  button {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    padding: 6px 14px;
    font-family: var(--font);
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; border-radius: 0;
    margin-right: 0; margin-top: 0;
    transition: background 0.1s, border-color 0.1s;
  }
  button:hover { background: var(--accent-lo); border-color: var(--accent); }
  button.sec { color: var(--muted-mid); border-color: var(--border-hi); }
  button.sec:hover { color: var(--text); border-color: var(--muted-mid); background: transparent; }
  button.active { background: var(--accent-lo); color: var(--accent); border-color: var(--accent); }

  /* ── STATUS ── */
  .status { font-size: 11px; padding: 8px 12px; margin-top: 10px; border-left: 3px solid; letter-spacing: 0.02em; }
  .status.ok   { background: var(--accent-glow); color: var(--accent); border-color: var(--accent-dim); }
  .status.err  { background: var(--err-dim);     color: var(--err);    border-color: var(--err); }
  .status.info { background: var(--info-dim);    color: var(--info);   border-color: var(--info); }

  /* ── FILTER BAR ── */
  .filter-bar { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; align-items: center; }
  .filter-bar button { padding: 5px 11px; }
  .divider { width: 1px; height: 22px; background: var(--border-hi); margin: 0 3px; }
  .row-label { color: var(--muted); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }

  /* ── SEARCH ── */
  input[type=text] {
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border-hi);
    color: var(--text);
    font-family: var(--font);
    font-size: 11px;
    padding: 7px 10px;
    width: 100%; max-width: 420px;
    border-radius: 0; outline: none;
    margin-bottom: 10px;
    transition: border-left-color 0.15s;
  }
  input[type=text]:focus { border-left-color: var(--accent-dim); }
  input[type=text]::placeholder { color: var(--muted); }

  /* ── VAULT LIST ── */
  .vault-list {
    max-height: 240px; overflow-y: auto;
    border: 1px solid var(--border);
    background: var(--bg-deep);
    scrollbar-width: thin;
    scrollbar-color: var(--border-hi) transparent;
  }
  .vault-list::-webkit-scrollbar { width: 4px; }
  .vault-list::-webkit-scrollbar-thumb { background: var(--border-hi); }
  .vault-item {
    padding: 7px 10px; cursor: pointer;
    font-size: 11px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .vault-item:last-child { border-bottom: none; }
  .vault-item:hover { background: var(--accent-glow); }
  .vault-item.selected { background: var(--accent-lo); border-left: 2px solid var(--accent); }
  .vault-item .vname { color: var(--text); font-weight: 500; }
  .vault-item .vmeta { color: var(--muted); font-size: 10px; margin-top: 1px; }
  .vault-item .vapy { color: var(--accent); font-size: 12px; font-variant-numeric: tabular-nums; }
  .vault-item .vtvl { color: var(--muted-mid); font-size: 10px; }
  .ys-badge {
    display: inline-block;
    font-size: 8px; padding: 1px 5px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; margin-left: 6px;
    background: var(--accent-lo); color: var(--accent); border: 1px solid var(--accent-dim);
  }
  .blocked-badge {
    display: inline-block;
    font-size: 8px; padding: 1px 5px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; margin-left: 4px;
    background: var(--err-dim); color: var(--err); border: 1px solid var(--err);
  }

  /* ── CHIPS ── */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; min-height: 28px; }
  .chip {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 0;
    font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; cursor: pointer; border: 1px solid;
  }
  .chip .x { opacity: 0.5; font-size: 12px; }
  .chip:hover .x { opacity: 1; }

  /* ── LIST CONTROLS ── */
  .list-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .vault-count { color: var(--muted); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
  .list-controls button { padding: 4px 10px; }

  /* ── BUTTON GROUPS ── */
  .btn-group { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  .btn-group button { margin: 0; }

  /* ── STAT CARDS ── */
  .stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--bg-deep); border: 1px solid var(--border); border-bottom: 2px solid var(--border-hi); padding: 10px 14px; }
  .stat .label { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 4px; }
  .stat .value { font-size: 20px; color: var(--accent); font-weight: 300; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .sub2 { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* ── CHART ── */
  #chartWrap { position: relative; width: 100%; height: 460px; }
  canvas { width: 100% !important; }

  /* ── LEGEND ── */
  #legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .leg-item { display: flex; align-items: center; gap: 7px; font-size: 11px; }
  .leg-swatch { width: 20px; height: 3px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="app-bar">
  <div>
    <div class="app-name">DeFi Yield Chart</div>
    <div class="app-meta">Historical APY · Load master.csv → select vaults → chart</div>
  </div>
</div>

<!-- 01 LOAD -->
<div class="panel">
  <h2>01 — Load Data</h2>
  <button onclick="pickFile()">Open master.csv</button>
  <div id="loadStatus"></div>
</div>

<!-- 02 SELECT -->
<div class="panel" id="selectPanel" style="display:none">
  <h2>02 — Select Vaults</h2>

  <div class="filter-bar">
    <button id="f-all" class="active" onclick="setFilter('all')">All</button>
    <button id="f-ys" class="sec" onclick="setFilter('ys')">⚡ YS Whitelist</button>
    <div class="divider"></div>
    <button id="f-morpho" class="sec" onclick="setFilter('morpho')">Morpho</button>
    <button id="f-aave" class="sec" onclick="setFilter('aave')">Aave</button>
    <button id="f-euler" class="sec" onclick="setFilter('euler')">Euler</button>
    <button id="f-fluid" class="sec" onclick="setFilter('fluid')">Fluid</button>
    <div class="divider"></div>
    <button id="f-base" class="sec" onclick="setFilter('base')">Base</button>
    <button id="f-arbitrum" class="sec" onclick="setFilter('arbitrum')">Arbitrum</button>
    <button id="f-solana" class="sec" onclick="setFilter('solana')">Solana</button>
    <button id="f-monad" class="sec" onclick="setFilter('monad')">Monad</button>
    <div class="divider"></div>
    <button id="f-full" class="sec" onclick="setFilter('full')">Complete Series</button>
    <div class="divider"></div>
    <span class="row-label">Sort:</span>
    <button id="s-apy" class="active" onclick="setSort('apy')">APY</button>
    <button id="s-tvl" class="sec" onclick="setSort('tvl')">TVL</button>
    <button id="s-days" class="sec" onclick="setSort('days')">Days</button>
  </div>

  <input type="text" id="search" placeholder="Search pool, project, chain..." oninput="renderVaultList()">

  <div class="chips" id="chips"></div>

  <div class="list-controls">
    <span id="vaultCount" class="vault-count"></span>
    <div style="display:flex;gap:5px;">
      <button class="sec" onclick="selectFiltered()">Select All Visible</button>
      <button class="sec" onclick="clearAll()">Clear All</button>
    </div>
  </div>
  <div class="vault-list" id="vaultList"></div>
</div>

<!-- 03 CHART -->
<div class="panel" id="chartPanel" style="display:none">
  <h2>03 — Chart</h2>

  <div class="btn-group" style="margin-bottom:8px;">
    <span class="row-label" style="line-height:28px;margin-right:4px;">Metric:</span>
    <button id="btn-apy"             class="active" onclick="setMetric('apy')">APY</button>
    <button id="btn-base_apy"        class="sec"    onclick="setMetric('base_apy')">Base APY</button>
    <button id="btn-reward_apy"      class="sec"    onclick="setMetric('reward_apy')">Reward APY</button>
    <button id="btn-avg_30d"         class="sec"    onclick="setMetric('avg_30d')">30d Avg</button>
    <button id="btn-tvl_raw"         class="sec"    onclick="setMetric('tvl_raw')">TVL</button>
    <button id="btn-avail_liquidity" class="sec"    onclick="setMetric('avail_liquidity')">Avail. Liq.</button>
    <button id="btn-supply_cap_util" class="sec"    onclick="setMetric('supply_cap_util')">Cap Util %</button>
  </div>

  <div class="btn-group">
    <span class="row-label" style="line-height:28px;margin-right:4px;">Range:</span>
    <button id="r-7"  class="sec"    onclick="setRange(7)">7d</button>
    <button id="r-14" class="sec"    onclick="setRange(14)">14d</button>
    <button id="r-30" class="sec"    onclick="setRange(30)">30d</button>
    <button id="r-0"  class="active" onclick="setRange(0)">All</button>
  </div>

  <div class="stats-row" id="statsRow"></div>
  <div id="chartWrap"><canvas id="chart"></canvas></div>
  <div id="legend"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>

// ============ YS Whitelist — synced with tracker.html ============
const YS_VAULTS = [
  { pool: /40 acres/i,                   project: /harvest/i,     blocked: true  },
  { pool: /steakusdc/i,                  project: /morpho/i                       },
  { pool: /steakusdcp/i,                 project: /morpho/i                       },
  { pool: /usdc/i,                       project: /aave v3/i,     chain: /base/i  },
  { pool: /sparkusdc/i,                  project: /morpho/i                       },
  { pool: /gtusdcf/i,                    project: /morpho/i                       },
  { pool: /usdc/i,                       project: /revert/i                       },
  { pool: /baseusd/i,                    project: /tokemak/i                      },
  { pool: /ottousd/i,                    project: /tokemak/i                      },
  { pool: /usdc/i,                       project: /alphagrowth/i                  },
  { pool: /yoUSD|yovault/i                                                        },
  { pool: /re7usdc|yearn.*og|og.*usdc/i, project: /morpho/i                       },
  { pool: /ultra.*usdc|ultrayield/i,     project: /morpho/i                       },
  { pool: /^mwusdc$/i,                   project: /morpho/i,      chain: /base/i  },
  { pool: /^csrusdc$/i,                  project: /morpho/i                       },
  { pool: /^csusdc$/i,                   project: /morpho/i                       },
  { pool: /^ycsusdc$/i,                  project: /morpho/i                       },
  { pool: /^gtusdcc$/i,                  project: /morpho/i,      chain: /base/i  },
  { pool: /^gtusdcp$/i,                  project: /morpho/i,      chain: /base/i  },
  { pool: /^usdc$/i,                     project: /fluid/i,       chain: /base/i  },
  { project: /avantis/i,                 chain: /base/i,          blocked: true   },
];

function isYS(vault) {
  const match = YS_VAULTS.find(rule => {
    if (rule.pool    && !rule.pool.test(vault.pool))       return false;
    if (rule.project && !rule.project.test(vault.project)) return false;
    if (rule.chain   && !rule.chain.test(vault.chain))     return false;
    return true;
  });
  return match ? { ys: true, blocked: !!match.blocked } : { ys: false, blocked: false };
}

// ============ Colors ============
const COLORS = [
  '#00EF78','#4DBAF5','#F5A024','#E54E4E','#A78BFA',
  '#34D399','#FB923C','#F472B6','#38BDF8','#FACC15',
  '#C084FC','#4ADE80','#F87171','#93C5FD','#FDE68A',
];

// ============ State ============
let allRows    = [];
let vaults     = [];
let selected   = [];
let metric     = 'apy';
let chartInst  = null;
let activeFilter = 'all';
let activeSort   = 'apy';
let maxDays      = 7;
let rangeLimit   = 0;

// ============ Filter / Sort / Range ============
function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('[id^="f-"]').forEach(b => b.className = 'sec');
  const el = document.getElementById('f-' + f);
  if (el) el.className = 'active';
  renderVaultList();
}

function setSort(s) {
  activeSort = s;
  document.querySelectorAll('[id^="s-"]').forEach(b => b.className = 'sec');
  document.getElementById('s-' + s).className = 'active';
  renderVaultList();
}

function setRange(r) {
  rangeLimit = r;
  document.querySelectorAll('[id^="r-"]').forEach(b => b.className = 'sec');
  document.getElementById('r-' + r).className = 'active';
  if (selected.length > 0) drawChart();
}

function getDateRange() {
  const dates = [...new Set(allRows.map(r => r.date))].sort();
  return (rangeLimit === 0 || dates.length <= rangeLimit) ? dates : dates.slice(-rangeLimit);
}

function getFiltered() {
  const q = (document.getElementById('search')?.value || '').toLowerCase();
  return vaults.filter(v => {
    if (q && !v.pool.toLowerCase().includes(q) && !v.project.toLowerCase().includes(q) && !v.chain.toLowerCase().includes(q)) return false;
    switch (activeFilter) {
      case 'ys':       return v.ys;
      case 'morpho':   return /morpho/i.test(v.project);
      case 'aave':     return /aave/i.test(v.project);
      case 'euler':    return /euler/i.test(v.project);
      case 'fluid':    return /fluid/i.test(v.project);
      case 'base':     return /base/i.test(v.chain);
      case 'arbitrum': return /arbitrum/i.test(v.chain);
      case 'solana':   return /solana/i.test(v.chain);
      case 'monad':    return /monad/i.test(v.chain);
      case 'full':     return v.days >= maxDays;
      default:         return true;
    }
  }).sort((a, b) => {
    if (activeSort === 'tvl')  return (b.latestTvl ?? 0) - (a.latestTvl ?? 0);
    if (activeSort === 'days') return b.days - a.days;
    return (b.latestApy ?? 0) - (a.latestApy ?? 0);
  });
}

function selectFiltered() {
  const toAdd = getFiltered().map(v => v.key).filter(k => !selected.includes(k));
  const spots = 15 - selected.length;
  if (spots <= 0) { alert('Max 15 vaults selected.'); return; }
  selected = [...selected, ...toAdd.slice(0, spots)];
  renderVaultList();
  renderChips();
  if (selected.length > 0) { document.getElementById('chartPanel').style.display = 'block'; drawChart(); }
}

// ============ File loading ============
async function pickFile() {
  try {
    const [fh] = await window.showOpenFilePicker({ types: [{ description: 'CSV', accept: { 'text/csv': ['.csv'] } }] });
    const text = await (await fh.getFile()).text();
    loadCSV(text);
  } catch (e) {
    if (e.name !== 'AbortError') showStatus('loadStatus', 'Error: ' + e.message, 'err');
  }
}

function parseNum(s) {
  if (!s || s === '') return null;
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function loadCSV(text) {
  const lines = text.trim().split('\n');
  const header = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
  allRows = [];
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const cells = [];
    let cur = '', inQ = false;
    for (let j = 0; j < line.length; j++) {
      if (line[j] === '"') { inQ = !inQ; continue; }
      if (line[j] === ',' && !inQ) { cells.push(cur); cur = ''; }
      else cur += line[j];
    }
    cells.push(cur);
    const row = {};
    header.forEach((h, idx) => row[h] = cells[idx] ?? '');
    allRows.push(row);
  }

  const vaultMap = {};
  for (const r of allRows) {
    const key = r.pool + '|' + r.project + '|' + r.chain;
    if (!vaultMap[key]) vaultMap[key] = { key, pool: r.pool, project: r.project, chain: r.chain, days: 0, latestApy: null, latestTvl: null };
    vaultMap[key].days++;
    if (parseNum(r.apy)     !== null) vaultMap[key].latestApy = parseNum(r.apy);
    if (parseNum(r.tvl_raw) !== null) vaultMap[key].latestTvl = parseNum(r.tvl_raw);
  }

  vaults = Object.values(vaultMap).map(v => {
    const ysInfo = isYS(v);
    return { ...v, ys: ysInfo.ys, blocked: ysInfo.blocked };
  }).sort((a, b) => (b.latestApy ?? 0) - (a.latestApy ?? 0));

  maxDays = Math.max(...vaults.map(v => v.days));
  const dates = [...new Set(allRows.map(r => r.date))].sort();
  showStatus('loadStatus', `✓ ${allRows.length} rows · ${vaults.length} vaults · ${dates.length} days (${dates[0]} → ${dates[dates.length-1]})`, 'ok');

  selected = []; activeFilter = 'all'; activeSort = 'apy'; rangeLimit = 0;
  document.querySelectorAll('[id^="f-"]').forEach(b => b.className = 'sec');
  document.getElementById('f-all').className = 'active';
  document.querySelectorAll('[id^="s-"]').forEach(b => b.className = 'sec');
  document.getElementById('s-apy').className = 'active';
  document.querySelectorAll('[id^="r-"]').forEach(b => b.className = 'sec');
  document.getElementById('r-0').className = 'active';
  document.getElementById('selectPanel').style.display = 'block';
  document.getElementById('chartPanel').style.display = 'none';
  renderVaultList();
}

// ============ Vault list ============
function renderVaultList() {
  const filtered = getFiltered();
  document.getElementById('vaultCount').textContent = `${filtered.length} vaults`;
  document.getElementById('vaultList').innerHTML = filtered.slice(0, 120).map(v => {
    const sel = selected.includes(v.key);
    const apy = v.latestApy !== null ? v.latestApy.toFixed(2) + '%' : '—';
    const tvl = v.latestTvl !== null ? fmtUsd(v.latestTvl) : '—';
    const badge = v.ys
      ? (v.blocked ? `<span class="blocked-badge">⊘ Blocked</span>` : `<span class="ys-badge">⚡ YS</span>`)
      : '';
    return `<div class="vault-item ${sel ? 'selected' : ''}" onclick="toggleVault('${v.key.replace(/'/g,"\\'")}')">
      <div>
        <span class="vname">${escHtml(v.pool)}</span>${badge}
        <div class="vmeta">${escHtml(v.project)} · ${escHtml(v.chain || '—')} · ${v.days}d</div>
      </div>
      <div style="text-align:right">
        <div class="vapy">${apy}</div>
        <div class="vtvl">${tvl}</div>
      </div>
    </div>`;
  }).join('');
}

function toggleVault(key) {
  if (selected.includes(key)) {
    selected = selected.filter(k => k !== key);
  } else {
    if (selected.length >= 15) { alert('Max 15 vaults at once.'); return; }
    selected.push(key);
  }
  renderVaultList();
  renderChips();
  if (selected.length > 0) { document.getElementById('chartPanel').style.display = 'block'; drawChart(); }
  else document.getElementById('chartPanel').style.display = 'none';
}

function clearAll() {
  selected = [];
  renderVaultList();
  renderChips();
  document.getElementById('chartPanel').style.display = 'none';
}

function renderChips() {
  document.getElementById('chips').innerHTML = selected.map((key, idx) => {
    const v = vaults.find(x => x.key === key);
    if (!v) return '';
    const col = COLORS[idx % COLORS.length];
    return `<div class="chip" style="color:${col};border-color:${col};background:${col}18" onclick="toggleVault('${key.replace(/'/g,"\\'")}')">
      <span>${escHtml(v.pool)}</span>
      <span class="x">×</span>
    </div>`;
  }).join('');
}

// ============ Metric ============
const METRICS = ['apy','base_apy','reward_apy','avg_30d','tvl_raw','avail_liquidity','supply_cap_util'];

function setMetric(m) {
  metric = m;
  METRICS.forEach(id => { document.getElementById('btn-' + id).className = id === m ? 'active' : 'sec'; });
  drawChart();
}

function metricLabel() {
  return {
    apy: 'APY %', base_apy: 'Base APY %', reward_apy: 'Reward APY %',
    avg_30d: '30d Avg APY %', tvl_raw: 'TVL (USD)',
    avail_liquidity: 'Avail. Liquidity (USD)', supply_cap_util: 'Supply Cap Util %'
  }[metric] || metric;
}

function isCurrency() { return metric === 'tvl_raw' || metric === 'avail_liquidity'; }

function fmtVal(v) {
  if (v === null || v === undefined) return '—';
  if (isCurrency()) return fmtUsd(v);
  return v.toFixed(2) + '%';
}

function fmtUsd(v) {
  if (v >= 1e9) return '$' + (v/1e9).toFixed(2) + 'b';
  if (v >= 1e6) return '$' + (v/1e6).toFixed(2) + 'm';
  if (v >= 1e3) return '$' + (v/1e3).toFixed(1) + 'k';
  return '$' + v.toFixed(0);
}

// ============ Chart ============
function drawChart() {
  const dates = getDateRange();
  const showPoints = dates.length <= 14;

  const datasets = selected.map((key, idx) => {
    const v = vaults.find(x => x.key === key);
    const col = COLORS[idx % COLORS.length];
    const data = dates.map(d => {
      const row = allRows.find(r => r.date === d && (r.pool + '|' + r.project + '|' + r.chain) === key);
      return row ? parseNum(row[metric]) : null;
    });
    return {
      label: v.pool + ' · ' + v.project,
      data,
      borderColor: col,
      backgroundColor: col + '12',
      pointBackgroundColor: col,
      pointRadius: showPoints ? 3 : 0,
      pointHoverRadius: 5,
      borderWidth: 1.5,
      tension: 0.25,
      spanGaps: true,
      fill: selected.length === 1,
    };
  });

  renderStats(datasets, dates);

  const ctx = document.getElementById('chart').getContext('2d');
  if (chartInst) chartInst.destroy();
  chartInst = new Chart(ctx, {
    type: 'line',
    data: { labels: dates, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0A0E0A',
          borderColor: '#27402C',
          borderWidth: 1,
          titleColor: '#6B8870',
          bodyColor: '#CCDACE',
          padding: 10,
          callbacks: {
            label: ctx => ' ' + ctx.dataset.label + ': ' + fmtVal(ctx.parsed.y)
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#192C1D' },
          ticks: {
            color: '#4D6A54',
            font: { family: 'ui-monospace,Cascadia Mono,Menlo,Consolas,monospace', size: 10 },
            maxTicksLimit: 14,
          }
        },
        y: {
          grid: { color: '#192C1D' },
          ticks: {
            color: '#4D6A54',
            font: { family: 'ui-monospace,Cascadia Mono,Menlo,Consolas,monospace', size: 10 },
            callback: v => fmtVal(v)
          },
          title: {
            display: true,
            text: metricLabel(),
            color: '#4D6A54',
            font: { family: 'ui-monospace,Cascadia Mono,Menlo,Consolas,monospace', size: 10 }
          }
        }
      }
    }
  });

  document.getElementById('legend').innerHTML = selected.map((key, idx) => {
    const v = vaults.find(x => x.key === key);
    const col = COLORS[idx % COLORS.length];
    const badge = v.ys
      ? (v.blocked ? `<span class="blocked-badge">⊘ Blocked</span>` : `<span class="ys-badge">⚡ YS</span>`)
      : '';
    return `<div class="leg-item">
      <div class="leg-swatch" style="background:${col}"></div>
      <span>${escHtml(v.pool)} · ${escHtml(v.project)} · ${escHtml(v.chain||'—')}</span>
      ${badge}
    </div>`;
  }).join('');
}

function renderStats(datasets, dates) {
  if (!datasets.length) { document.getElementById('statsRow').innerHTML = ''; return; }
  const lastDate  = dates[dates.length - 1];
  const firstDate = dates[0];
  const latestVals = datasets.map(ds => ds.data[dates.length - 1]).filter(v => v !== null);
  const allVals    = datasets.flatMap(ds => ds.data).filter(v => v !== null);

  const avg = latestVals.length ? latestVals.reduce((s,v) => s+v, 0) / latestVals.length : null;
  const max = allVals.length ? Math.max(...allVals) : null;
  const min = allVals.length ? Math.min(...allVals) : null;

  const deltas = datasets.map(ds => {
    const first = ds.data.find(v => v !== null);
    const last  = [...ds.data].reverse().find(v => v !== null);
    return (first != null && last != null) ? last - first : null;
  }).filter(d => d !== null);
  const avgDelta   = deltas.length ? deltas.reduce((s,v) => s+v, 0) / deltas.length : null;
  const deltaStr   = avgDelta !== null ? (avgDelta >= 0 ? '+' : '') + fmtVal(avgDelta) : '—';
  const deltaColor = avgDelta == null ? 'var(--accent)' : avgDelta >= 0 ? 'var(--accent)' : 'var(--err)';

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="label">Latest Avg</div><div class="value">${fmtVal(avg)}</div><div class="sub2">${lastDate}</div></div>
    <div class="stat"><div class="label">Period High</div><div class="value">${fmtVal(max)}</div></div>
    <div class="stat"><div class="label">Period Low</div><div class="value">${fmtVal(min)}</div></div>
    <div class="stat"><div class="label">Period Trend</div><div class="value" style="color:${deltaColor}">${deltaStr}</div><div class="sub2">${firstDate} → ${lastDate}</div></div>
    <div class="stat"><div class="label">Vaults</div><div class="value">${selected.length}</div><div class="sub2">of 15 max</div></div>
  `;
}

// ============ Utils ============
function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showStatus(id, msg, type) {
  document.getElementById(id).innerHTML = `<div class="status ${type}">${msg}</div>`;
}
</script>
